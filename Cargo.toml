[package]
name = "dumbbell"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
eframe = "0.35"
indicatif = "0.18"
nalgebra = "0.35"
rand = "0.10"
rand_distr = "0.6"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
cudarc = { version = "0.19", features = [
  "cuda-12020",
  "nvrtc",
], optional = true }

[features]
default = ["gpu"]
gpu = ["dep:cudarc"]

[profile.release]
lto = "fat"
