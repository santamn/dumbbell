[package]
name = "dumbbell"
version = "0.4.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
eframe = "0.33.3"
indicatif = "0.18.4"
nalgebra = "0.34.1"
rand = "0.10.0"
rand_distr = "0.6.0"
rayon = "1.11.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
cudarc = { version = "0.19.4", features = [
  "cuda-12020",
  "nvrtc",
], optional = true }

[features]
default = ["gpu"]
gpu = ["dep:cudarc"]

[profile.release]
lto = "fat"
