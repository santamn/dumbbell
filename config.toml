# ダンベル型粒子ブラウン運動シミュレーションの設定ファイル
# 使い方: cargo run --release            (この設定で全ケースを実行)
#         cargo run --release -- animate (アニメーション表示)

delta_t = 2e-7        # 時間刻み幅 Δt
time = 10.0           # 総シミュレーション時間 T
k = 1.5e6             # 壁のばね定数 K
ensemble_size = 30000 # アンサンブルサイズ(1ケースあたりの粒子数)
output_dir = "data/example" # 全ケースの結果をまとめて出力するフォルダ

# 以下のリストの全組み合わせ(直積)がシミュレーションされる
f = [10.0, 20.0, 30.0] # 一定外力(x方向)
c_1 = [0.0, 5.0]       # 電場パラメータ C1 = βEp/l̃
c_2 = [0.0]            # 電場パラメータ C2 = ΔαE/p
l = [0.05, 0.1]        # 棒の長さ

# GPU実行の設定(省略可)
[gpu]
# ids = [3, 1, 2, 0]   # 使用するGPUのID(省略時は全GPU)
# tasks_per_gpu = 4    # GPUあたりの同時実行ケース数(省略時は実測に基づく既定値)
